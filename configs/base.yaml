experiment:
  name: base-encoder
  seed: 42
  output_dir: results/base

data:
  dataset_name: wikitext
  subset: wikitext-2-v1
  text_field: text
  max_length: 128
  train_split: train
  val_split: validation
  test_split: test

tokenizer:
  type: basic
  vocab_file: null
  lowercase: true

model:
  vocab_size: 50000
  embedding_dim: 128
  num_heads: 4
  num_layers: 2
  ff_dim: 512
  dropout: 0.1
  max_position_embeddings: 512
  layer_norm_eps: 1.0e-5
  use_decoder: false

optimization:
  batch_size: 32
  num_epochs: 10
  learning_rate: 3.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.98]
  eps: 1.0e-9
  grad_clip: 1.0
  warmup_steps: 4000
  scheduler: cosine

logging:
  log_interval: 100
  eval_interval: 500
