experiment:
  name: tiny-shakespeare-no-pos
  seed: 42
  output_dir: results/tiny_shakespeare_no_pos

data:
  dataset_name: local_text
  data_dir: data/tiny_shakespeare
  subset: null
  text_field: text
  max_length: 128
  train_split: train
  val_split: validation
  test_split: test
  lowercase: true
  limit_examples: null

tokenizer:
  type: basic
  vocab_file: null
  lowercase: true
  min_freq: 1
  pad_token: "<pad>"
  unk_token: "<unk>"
  bos_token: "<bos>"
  eos_token: "<eos>"

model:
  vocab_size: 0
  embedding_dim: 128
  num_heads: 4
  num_layers: 2
  ff_dim: 512
  dropout: 0.1
  max_position_embeddings: 256
  layer_norm_eps: 1.0e-5
  use_decoder: false
  use_positional_encoding: false

optimization:
  batch_size: 16
  num_epochs: 10
  learning_rate: 3.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.98]
  eps: 1.0e-9
  grad_clip: 1.0
  warmup_steps: 50
  scheduler: cosine

logging:
  log_interval: 10
  eval_interval: 200
