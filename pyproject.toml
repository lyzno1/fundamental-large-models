[project]
name = "fundamentals-large-models"
version = "0.1.0"
description = "Transformer 作业代码框架与实验脚手架"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "datasets>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundamentals_large_models"]

[tool.hatch.build.targets.sdist]
include = [
    "README.md",
    "src/fundamentals_large_models",
    "scripts",
    "configs",
]
